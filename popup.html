<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>따라미 사용 안내</title>
  <style>
    :root { color-scheme:dark; font:14px/1.5 system-ui,sans-serif }
    body { width:264px; margin:0; padding:18px; color:#f2f5f4; background:#1b2324 }
    h1,h2,p,dl,dd { margin:0 }
    h1 { font-size:26px; letter-spacing:-.05em }
    h2 { font-size:15px }
    p { margin-top:5px; color:#bac5c4 }
    section { margin-block:14px; padding-top:12px; border-top:1px solid #485352 }
    dl { display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:6px; margin-top:9px }
    dd { text-align:right }
    kbd { display:inline-block; min-width:1.3em; padding:1px 4px; border:1px solid #56625d; border-radius:4px; background:#293333; color:#edf5f1; font:600 12px/1.5 system-ui,sans-serif; text-align:center }
    a { display:block; padding:10px; border-radius:7px; background:#abebc0; color:#10251a; text-align:center; font-weight:650; text-decoration:none }
    a:hover { background:#c6f7d6 }
    a:focus-visible { outline:2px solid white; outline-offset:2px }
  </style>
</head>
<body>
  <h1>따라미</h1>
  <p>유튜브 영상을 열면 연습 패널이 나타납니다. 패널을 끌어 원하는 곳에 두세요.</p>
  <section aria-labelledby="keys">
    <h2 id="keys">연습 단축키</h2>
    <dl>
      <dt>시작 · 종료 지정</dt><dd><kbd>[</kbd> / <kbd>]</kbd></dd>
      <dt>구간 반복 정지 · 재개</dt><dd><kbd>\</kbd></dd>
      <dt>배속 높이기 · 낮추기</dt><dd><kbd>=</kbd> / <kbd>-</kbd></dd>
      <dt>현재 모드 시작 · 정지</dt><dd><kbd>Space</kbd></dd>
    </dl>
  </section>
  <a href="https://www.youtube.com" target="_blank" rel="noopener">유튜브 열기 ↗</a>
</body>
</html>
